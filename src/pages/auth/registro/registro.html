<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store | Crear cuenta</title>
</head>

<body>
    <main id="app" class="auth" hidden>
        <section class="tarjeta-auth">
            <h1>Food Store</h1>
            <h2>Crear cuenta</h2>

            <p class="auth__nota">Las cuentas nuevas se crean con el rol Cliente.</p>

            <form id="form-registro" novalidate>
                <div class="campo--doble">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="given-name"
                            required>
                    </div>
                    <div class="campo">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido"
                            autocomplete="family-name" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com"
                        autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password" required>
                </div>

                <div class="campo">
                    <label for="confirm-password">Repetir contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repetí la contraseña"
                        autocomplete="new-password" required>
                </div>

                <p id="form-message" class="mensaje" role="alert" aria-live="polite" hidden></p>

                <button type="submit">Registrarme</button>
            </form>

            <p class="auth__enlace">¿Ya tenés cuenta? <a href="../login/login.html">Iniciá sesión</a></p>
        </section>
    </main>

    <script type="module" src="./registro.ts"></script>
</body>

</html>
